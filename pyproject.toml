[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/tooling/*.py" = ["E402"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["gate_policy", "review_policy", "sonar_policy", "check_app_coverage"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.xml]
output = "coverage/tooling.xml"
