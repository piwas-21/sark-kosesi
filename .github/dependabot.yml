version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
