name: PostgreSQL sibling runtime root
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/db-sibling-runtime-root.yml
      - ops/db-sibling-runtime-root/**
      - scripts/capture_db_image_scan.py
permissions: {}
jobs:
  sibling-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check closure controls
        env:
          PYTHONPATH: scripts
        run: python3 ops/db-sibling-runtime-root/test_validate.py
      - name: Build and inspect disposable sibling root
        env:
          SIBLING_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ops/db-sibling-runtime-root/run.sh
      - name: Retain evidence or failure status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db-sibling-runtime-root-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/db-sibling-root-evidence/
          if-no-files-found: error
          retention-days: 30
