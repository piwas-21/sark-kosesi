name: PostgreSQL sibling composition lab
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/db-sibling-postgres.yml
      - ops/db-sibling-postgres/**
      - ops/db-sibling-runtime-root/**
      - ops/db-source-feature-smoke/**
      - ops/db-zlib-candidate/**
      - scripts/capture_db_image_scan.py
permissions: {}
jobs:
  composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check composition controls
        run: python3 ops/db-sibling-postgres/test_validate.py
      - name: Build and inspect isolated composition
        env:
          COMPOSE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ops/db-sibling-postgres/run.sh
      - name: Retain comparison and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db-sibling-postgres-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/db-sibling-postgres-evidence/
            ${{ runner.temp }}/db-sibling-root-evidence/
            ${{ runner.temp }}/db-source-feature-evidence/
          if-no-files-found: error
          retention-days: 30
