name: PostgreSQL source feature smoke
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/db-source-feature-smoke.yml
      - ops/db-source-feature-smoke/**
      - ops/db-zlib-candidate/pull_verified_base.sh
permissions: {}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check linkage, diagnostic and transfer controls
        run: |
          bash ops/db-source-feature-smoke/test-linkage.sh
          bash ops/db-source-feature-smoke/test-diagnostics.sh
          bash ops/db-source-feature-smoke/test-transfer.sh
      - name: Build and run isolated PostgreSQL feature smoke
        env:
          SMOKE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ops/db-source-feature-smoke/run.sh
      - name: Retain evidence and failure status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db-source-feature-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/db-source-feature-evidence/
          if-no-files-found: error
          retention-days: 30
