name: Isolated preview passive assessment
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/preview-passive.yml
      - tests/passive-preview/**
      - tests/tooling/test_passive_preview.py
      - deploy/staging/Dockerfile
      - apps/web/**
      - packages/**
      - crates/**
      - migrations/**
      - tests/fixtures/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - package-lock.json
      - .npmrc
      - .dockerignore
      - tsconfig.json
      - docs/SECURITY.md
      - docs/QUALITY.md
permissions: {}
jobs:
  passive:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ANALYSIS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run isolated passive assessment
        run: tests/passive-preview/run_isolated.sh
      - name: Retain sanitized evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: preview-passive-${{ env.ANALYSIS_REVISION }}
          path: .local/evidence/passive-preview.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
