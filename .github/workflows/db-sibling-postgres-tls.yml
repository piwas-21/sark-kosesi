name: PostgreSQL sibling TLS lab
on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/db-sibling-postgres-tls.yml
      - ops/db-sibling-postgres-tls/**
      - ops/db-sibling-postgres/**
      - ops/db-sibling-runtime-root/**
      - ops/db-source-feature-smoke/**
      - ops/db-zlib-candidate/pull_verified_base.sh
      - scripts/capture_db_image_scan.py
permissions: {}
jobs:
  tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check failure classification controls
        run: bash ops/db-sibling-postgres-tls/test_diagnostics.sh
      - name: Run synthetic isolated TLS checks
        env:
          TLS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ops/db-sibling-postgres-tls/run.sh
      - name: Retain sanitized status and hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: db-sibling-postgres-tls-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/db-sibling-tls-evidence/
          if-no-files-found: error
          retention-days: 30
