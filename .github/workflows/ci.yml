name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 1"
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --require-hashes -r requirements-dev.txt
          echo "$PWD/.local/venv/bin" >> "$GITHUB_PATH"
      - run: npm run check
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/scan_secrets.py
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies
  prototype:
    name: Prototype smoke
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --shm-size=1g
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:prototype
  sast:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
  sonar:
    name: SonarQube
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ANALYSIS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate actual tooling coverage
        run: |
          python3 -m venv .local/venv
          .local/venv/bin/pip install --require-hashes -r requirements-dev.txt
          export PATH="$PWD/.local/venv/bin:$PATH"
          npm run test:tooling
      - name: Start isolated Community Build
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072
          docker run --detach --name sonar-ci --publish 127.0.0.1:9000:9000 \
            --ulimit nofile=131072:131072 --ulimit nproc=8192:8192 \
            sonarqube:26.10.0.133078-community@sha256:0b3408443fb6a311253de27941b10977c9b977fd53be2265947bfe14161308b8
          python3 scripts/sonar_ci.py bootstrap
      - uses: SonarSource/sonarqube-scan-action@38f03825196cad93cbb3d92e9d20d1f1fe7dc2a7
        with:
          scannerVersion: 8.2.0.6438
          args: >-
            -Dsonar.scm.revision=${{ env.ANALYSIS_REVISION }}
      - run: python3 scripts/sonar_ci.py verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-${{ env.ANALYSIS_REVISION }}
          path: .local/sonar-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Dispose isolated server
        if: always()
        run: docker rm --force --volumes sonar-ci
  quality:
    name: Quality gate
    if: always()
    needs: [foundation, secrets, dependencies, prototype, sast, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every prerequisite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('A required check failed, was cancelled or was skipped.')
          print('All foundation checks succeeded. Production readiness remains a separate gate.')
          PY
