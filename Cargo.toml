[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api", "crates/worker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Piwas-Proprietary"
publish = false

[workspace.dependencies]
commerce-domain = { path = "crates/domain", version = "=0.1.0" }
commerce-application = { path = "crates/application", version = "=0.1.0" }
commerce-infrastructure = { path = "crates/infrastructure", version = "=0.1.0" }
axum = "=0.8.9"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
email_address = { version = "=0.2.9", default-features = false }
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
utoipa = "=6.0.0"
subtle = "=2.6.1"
tower = { version = "=0.5.3", features = ["util"] }
tower-sessions = { version = "=0.15.0", default-features = false, features = ["axum-core"] }
async-trait = "=0.1.92"
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.11"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
