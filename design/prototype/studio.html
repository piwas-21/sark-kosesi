<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Piwas — The living courtyard · Direction 02</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#c9d1bf;color:#e4ecb3;font:12px Arial,sans-serif}.studio-bar{min-height:54px;background:#173b31;display:flex;align-items:center;justify-content:space-between;padding:9px 18px;gap:14px}.studio-brand{font-size:11px;line-height:1.5}.studio-brand strong{font-weight:500}.studio-brand span{opacity:.65;margin-left:10px;font-size:10px}.studio-bar nav,.devices{display:flex;gap:4px}.studio-bar button,.studio-bar a{font:11px Arial;color:inherit;background:none;border:0;border-radius:20px;padding:9px 13px;cursor:pointer;text-decoration:none;white-space:nowrap}.studio-bar button.active{background:#e4ecb3;color:#173b31}.studio-bar a{border:1px solid #729079}.studio-bar button:focus-visible,.studio-bar a:focus-visible{outline:2px solid #e4ecb3;outline-offset:2px}.frame-wrap{display:flex;justify-content:center;overflow:hidden;padding:0;height:calc(100dvh - 54px)}iframe{flex-shrink:0;border:0;background:#153d31;transform-origin:top center}.mobile{padding-top:16px}.mobile iframe{border:5px solid #173b31;border-radius:24px;box-shadow:0 15px 50px #173b3133}.devices{align-items:center;border-left:1px solid #527461;padding-left:10px}.devices svg{height:16px;width:16px;vertical-align:middle;margin-right:5px;fill:none;stroke:currentColor;stroke-width:1.4}@media(max-width:850px){.studio-brand span{display:none}.studio-bar{flex-wrap:wrap;gap:6px;padding:8px 12px}.studio-brand{width:100%;font-size:10px}.studio-bar button,.studio-bar a{padding:8px 10px;font-size:10px}.devices a{display:none}}@media(max-width:400px){.devices svg{display:none}.studio-bar button{padding:8px}.devices{padding-left:3px}}
</style></head>
<body><header class="studio-bar"><div class="studio-brand"><strong>The living courtyard</strong><span>Piwas / direction 02</span></div><nav aria-label="Preview screens"><button data-screen="home" class="active">Storefront</button><button data-screen="product">The set</button><button data-screen="planner">Room planner</button><button data-screen="admin">Admin</button></nav><div class="devices"><button id="desktop" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M12 17v4m-5 0h10"/></svg>Desktop</button><button id="mobile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg>Mobile</button><a href="index.html?lang=en&theme=light" target="_blank">Full size</a></div></header><div id="wrap" class="frame-wrap"><iframe id="preview" title="Interactive Dicle design concept"></iframe></div>
<script>
const wrap=document.getElementById('wrap'),frame=document.getElementById('preview'),params=new URLSearchParams(location.search);let mobile=params.has('device')?params.get('device')==='mobile':innerWidth<700;params.set('embed','1');params.set('v','4');frame.src='index.html?'+params.toString()+'#'+(params.get('view')||'home');
function layout(){const width=mobile?400:1280,available=innerHeight-document.querySelector('.studio-bar').offsetHeight-(mobile?32:0),scale=Math.min(1,innerWidth/width);frame.style.width=width+'px';frame.style.height=Math.max(mobile?820:700,available/scale)+'px';frame.style.transform='scale('+scale+')';wrap.style.height=(innerHeight-document.querySelector('.studio-bar').offsetHeight)+'px';wrap.classList.toggle('mobile',mobile);document.getElementById('mobile').classList.toggle('active',mobile);document.getElementById('desktop').classList.toggle('active',!mobile)}
document.querySelectorAll('[data-screen]').forEach(button=>button.onclick=()=>{frame.contentWindow.postMessage({type:'preview-view',view:button.dataset.screen},location.origin);document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b===button))});document.getElementById('mobile').onclick=()=>{mobile=true;layout()};document.getElementById('desktop').onclick=()=>{mobile=false;layout()};addEventListener('resize',layout);layout();
</script></body></html>
