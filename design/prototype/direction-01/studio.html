<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Piwas · Dicle design studio</title><style>*{box-sizing:border-box}body{margin:0;background:#d9dcd6;color:#272b2b;font:13px Arial,sans-serif}.studio-bar{min-height:58px;background:#202626;color:#f5f3ee;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px}.studio-bar strong{font-size:12px;font-weight:400}.studio-bar div{display:flex;gap:8px}.studio-bar button,.studio-bar a{border:1px solid #707671;background:none;color:inherit;font:12px Arial;padding:9px 12px;text-decoration:none;border-radius:4px;cursor:pointer;white-space:nowrap}.studio-bar .active{background:#f5f3ee;color:#272b2b}.frame-wrap{display:flex;justify-content:center;height:calc(100vh - 58px);padding:18px 0;overflow:hidden}iframe{flex-shrink:0;border:0;background:#f5f3ee;transform-origin:top center}.mobile iframe{border-radius:16px;box-shadow:0 8px 45px #0003;border:6px solid #272b2b}@media(max-width:600px){.studio-bar{padding:8px 12px;flex-wrap:wrap}.studio-bar strong{font-size:11px}.studio-bar button,.studio-bar a{font-size:10px;padding:8px}.studio-bar a{display:none}}</style></head><body><header class="studio-bar"><strong>Piwas / a şark köşesi shop · direction 01</strong><div><button id="desktop" class="active">Desktop</button><button id="mobile">Mobile</button><a href="index.html" target="_blank">Full size</a></div></header><div id="wrap" class="frame-wrap"><iframe id="preview" title="Interactive Dicle design concept"></iframe></div><script>const wrap=document.getElementById('wrap'),frame=document.getElementById('preview'),params=new URLSearchParams(location.search);let mobile=params.get('device')==='mobile';frame.src='index.html?'+params.toString()+'#'+(params.get('view')||'home');function layout(){const width=mobile?402:1280,scale=Math.min(1,(innerWidth-28)/width),height=(innerHeight-document.querySelector('.studio-bar').offsetHeight-36)/scale;frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';wrap.classList.toggle('mobile',mobile);document.getElementById('mobile').classList.toggle('active',mobile);document.getElementById('desktop').classList.toggle('active',!mobile)}document.getElementById('mobile').onclick=()=>{mobile=true;layout()};document.getElementById('desktop').onclick=()=>{mobile=false;layout()};addEventListener('resize',layout);layout();</script></body></html>
